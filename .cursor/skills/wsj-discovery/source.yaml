id: wsj
name: Wsj
homepage: https://www.wsj.com/
entry_url: https://www.wsj.com/

discovery:
  type: website_html
  method: GET
  url: https://www.wsj.com/
  fields:
    id: href path (fallback sample id)
    title: homepage link title (fallback sample title)
    url: absolute article url
    published_at: fallback timestamp
    author: Wall Street Journal
    summary: fallback summary
  pagination:
    page_param: page
    per_param: per

content:
  type: website_html
  url_template: https://www.wsj.com/{id}
  fields:
    title: title
    published_at: published_at
    author: author
    html: content_html

quirks:
  - wsj.com 在当前环境对匿名请求普遍返回 401/403（首页、栏目页、归档页）。
  - 适配器先尝试直连首页提取 /articles/ 链接，失败时切换到内置稳定样本。
  - 禁止 RSS/Atom；本 skill 未使用 RSS 端点。
  - published_at 统一转换为 Asia/Shanghai ISO8601。

validation:
  last_verified_at: "2026-07-08"
