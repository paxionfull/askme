id: zerohedge
name: Zerohedge
homepage: https://www.zerohedge.com
entry_url: https://www.zerohedge.com/

discovery:
  type: nextjs_ssr
  method: GET
  url: https://www.zerohedge.com/
  pagination:
    path_template: /page/{page}
    page_starts_at: 1
  fields:
    id: pageProps.results[].nid
    title: pageProps.results[].title
    url: pageProps.results[].path
    published_at: pageProps.results[].created
    author: pageProps.results[].name
    cover_image: pageProps.results[].teaserImageUrl
    summary_html: pageProps.results[].body

content:
  type: nextjs_ssr
  url_template: https://www.zerohedge.com{path}
  fields:
    id: pageProps.node.nid
    title: pageProps.node.title
    published_at: pageProps.node.created
    author: pageProps.node.authorName
    html: pageProps.node.body

quirks:
  - ZeroHedge 首页与文章页均为 Next.js SSR，核心数据位于 `__NEXT_DATA__`。
  - 列表文章使用 `pageProps.results`，详情正文使用 `pageProps.node.body`。
  - 页面路由分页使用 `/page/{n}`（首页为 `/`），并非 RSS/Atom。
  - 发布时间形如 `2026-07-07T21:10:00-0400`，需转换为 Asia/Shanghai ISO8601。

validation:
  last_verified_at: "2026-07-08"
