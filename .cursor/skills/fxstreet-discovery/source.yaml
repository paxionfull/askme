id: fxstreet
name: Fxstreet
homepage: https://www.fxstreet.com
entry_url: https://www.fxstreet.com/news

discovery:
  type: google_news_sitemap
  url: https://www.fxstreet.com/google-sitemap-news.xml
  fields:
    id: loc_path
    title: news:title
    url: loc
    published_at: news:publication_date
    keywords: news:keywords
  pagination:
    page_param: page
    per_param: per
    note: sitemap 全量拉取后按 page/per 切片

content:
  type: html
  url_template: https://www.fxstreet.com/{id}
  fields:
    title: jsonld.NewsArticle.headline
    published_at: jsonld.NewsArticle.datePublished
    author: jsonld.NewsArticle.author.name
    html: article.flex.flex-col

quirks:
  - 首页与 /news 为 Next.js App Router；客户端 Algolia 翻页走 /api/v1/trpc/algolia.get，需 Turnstile，不可用作服务端列表源。
  - robots.txt 声明 google-sitemap-news.xml / sitemap-news.xml，后者无 news: 扩展；列表使用 Google News Sitemap。
  - publication_date 为 UTC（含 7 位小数），discover.py 转为 Asia/Shanghai ISO8601。
  - 正文取详情页 <article class="flex flex-col gap-8 ...">，并以 NewsArticle JSON-LD 作元数据回退。
  - 禁止 RSS/Atom（/news/feed 为 HTML 页面，非订阅源）。

validation:
  last_verified_at: "2026-07-08"
  expected_min_items: 5
