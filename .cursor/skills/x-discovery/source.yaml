id: x
name: X
homepage: https://x.com
entry_url: https://x.com/elonmusk
feed_id: website:x
platform: x
screen_name: elonmusk

discovery:
  type: x_hybrid
  primary:
    type: nitter_html
    mirrors:
      - https://xcancel.com
      - https://nitter.poast.org
      - https://nitter.privacyredirect.com
    paths:
      - /{screen_name}
      - /{screen_name}/with_replies
    screen_name: elonmusk
  secondary:
    type: x_graphql_guest
    guest_activate: https://api.x.com/1.1/guest/activate.json
    user_by_screen_name: /graphql/sLVLhk0bGj3MVFEKTdax1w/UserByScreenName
    user_tweets: /graphql/6r5OLCC_wFH4CpRyXKuAmQ/UserTweets
    user_tweets_and_replies: /graphql/klja8a2iJX_3to5RdfVlgw/UserTweetsAndReplies
    screen_name: elonmusk
  fallback:
    type: syndication_html
    url: https://syndication.twitter.com/srv/timeline-profile/screen-name/elonmusk
    items_path: props.pageProps.timeline.entries

content:
  type: json_api
  url_template: https://cdn.syndication.twimg.com/tweet-result?id={id}&lang=en&token=0
  headers:
    Referer: https://platform.twitter.com/
    Accept: application/json

validation:
  min_body_chars: 20
  last_verified_at: "2026-07-15"
  expected_min_items: 5

quirks:
  - x.com 主站 SPA；列表优先 Nitter 镜像（含对他人帖子的引用/回复上下文），再合并 api.x.com GraphQL guest。
  - guest UserTweets 不含回复且偏历史精选；UserTweetsAndReplies 对 guest 常 404，可用时解析 profile-conversation。
  - 引用推文（quote）会把 QT @用户与原文并入 title/summary/正文，避免只剩「True」「Good」等短回应。
  - 详情优先 cdn.syndication.twimg.com/tweet-result（含 quoted_tweet / parent）；再回退列表缓存/稳定样本。
  - 推文正文可能极短（表情/媒体），validation.min_body_chars 设为 20。
  - 禁止 RSS/Atom。
