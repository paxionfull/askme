id: deepseek
name: Deepseek
homepage: https://deepseek.ai
entry_url: https://deepseek.ai/blog

discovery:
  type: supabase_rest
  method: GET
  url: https://fnlfrdinxtwkhzbmyawv.supabase.co/rest/v1/blog_posts
  headers:
    Accept: application/json
    Referer: https://deepseek.ai/blog
    apikey: "public-anon-key-in-discover.py"
    Authorization: "Bearer public-anon-key-in-discover.py"
  query:
    select: id,title,slug,excerpt,category,published_at,hero_image_url
    status: eq.published
    order: published_at.desc
    limit: 20
    offset: 0
  fields:
    id: slug
    title: title
    slug: slug
    url_template: https://deepseek.ai/blog/{slug}
    published_at: published_at
    author: Deepseek
    cover_image: hero_image_url
    summary: excerpt
  pagination:
    offset_param: offset
    limit_param: limit
    has_next_rule: list_length_gte_limit

content:
  type: supabase_rest
  url: https://fnlfrdinxtwkhzbmyawv.supabase.co/rest/v1/blog_posts
  query:
    select: id,title,slug,excerpt,category,published_at,content,hero_image_url,meta_description
    slug: eq.{slug}
    status: eq.published
    limit: 1
  fields:
    title: title
    published_at: published_at
    html: content
    cover_image: hero_image_url
    summary: excerpt

quirks:
  - 入口页与文章页均为 SPA 壳页面，正文不在 HTML 中，需走 Supabase REST。
  - 列表与详情均来自 public.blog_posts 表，且必须带 apikey 与 Authorization。
  - published_at 为 UTC 偏移时间，discover.py 会统一转换到 Asia/Shanghai ISO8601。
  - 分页采用 limit + offset；当返回条数小于 limit 时视为末页。

validation:
  last_verified_at: "2026-07-08"
  expected_min_items: 3
