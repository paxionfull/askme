id: investinglive
name: Investinglive
homepage: https://investinglive.com/
entry_url: https://investinglive.com/stocks/

discovery:
  type: sitemap_news_xml
  method: GET
  url: https://investinglive.com/latest.xml
  fields:
    url: loc
    title: news:title
    published_at: news:publication_date
  filters:
    url_prefix: https://investinglive.com/stocks/
  pagination:
    mode: local_slice
    page_start: 1

content:
  type: html_jsonld
  url_template: https://investinglive.com/{id}
  body_field: NewsArticle.articleBody

quirks:
  - 列表来源使用 latest.xml（Google News sitemap），并筛选 /stocks/ 路径。
  - 发布时间字段为 UTC ISO8601，适配器统一转为 Asia/Shanghai ISO8601。
  - 正文优先读取页面 application/ld+json 的 NewsArticle.articleBody。

validation:
  last_verified_at: "2026-07-08"
