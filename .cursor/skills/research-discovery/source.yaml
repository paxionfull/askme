id: research
name: Research
homepage: https://research.google/
entry_url: https://research.google/blog/

discovery:
  type: html_pagination
  method: GET
  url: https://research.google/blog/?page=1
  pagination:
    page_param: page
    total_pages_from: data-page
  item_locator: 'a.glue-card--blog[href^="/blog/"]'
  fields:
    id: url_slug
    title: span.headline-6
    url: href
    published_at: p.glue-card__eyebrow.label
    image: img.src
    summary: span.not-glue.caption (topics)

content:
  type: html
  url_template: https://research.google/blog/{id}/
  fields:
    title: h1.headline-1
    published_at: .basic-hero--blog-detail__description > p:first-child
    author: .basic-hero--blog-detail__description > p:last-child
    summary: .blog-summary__summary
    html: div.rich-text.--mode-standalone

quirks:
  - 该站列表页为服务端 HTML，不提供公开 JSON 列表接口。
  - 分页通过 query 参数 page（例如 /blog/?page=2）。
  - 页面包含大量非文章链接，需仅提取 /blog/{slug}/ 且卡片类名为 glue-card--blog 的条目。
  - data-page 属性可提取站点总页数（当前可见约 133 页），用于 has_next_page。
  - 详情页正文在 rich-text --mode-standalone 区块，作者和日期在 basic-hero--blog-detail__description。

validation:
  last_verified_at: "2026-07-08"
