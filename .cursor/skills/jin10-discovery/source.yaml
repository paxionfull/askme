id: jin10
name: 金十数据
homepage: https://www.jin10.com/
entry_url: https://www.jin10.com/
platform: jin10
feed_id: website:jin10

discovery:
  type: jin10_flash_api
  url: https://flash-api.jin10.com/get_flash_list
  headers:
    x-app-id: bVBF4FyRTn5NJF5n
    x-version: 1.0.0
  query:
    channel: "-8200"
    vip: 1

validation:
  min_body_chars: 30
  last_verified_at: "2026-07-08"

quirks:
  - type=0 且 content 为空（含 VIP 锁定 lock=true）的快讯跳过，不写入列表。
  - type=1 为经济数据日历，非文章，跳过。
  - type=2 为 xnews 长文推广，使用 data.link 作为 url。
  - jin10.com 首页 / index.html 链接视为无效文章。
