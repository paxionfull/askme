id: goofish-search
name: Goofish · search
homepage: https://www.goofish.com
entry_url: https://www.goofish.com/search?q=%E7%BD%91%E7%90%83%E6%8B%8D&spm=a21ybx.home.searchInput.0

discovery:
  type: mtop_json
  method: POST
  requires_cookie: true
  auth_slot: goofish-com
  login_url: https://www.goofish.com/
  required_token: "_m_h5_tk=,unb=,cookie2="
  cookie_hint: 须真实扫码登录后的完整 Cookie：同时含 unb、cookie2、_m_h5_tk。仅有 _m_h5_tk/tfstk 仍是访客态。
  url: https://h5api.m.goofish.com/h5/mtop.taobao.idlemtopsearch.pc.search/1.0/
  api: mtop.taobao.idlemtopsearch.pc.search
  app_key: "34839810"
  keyword: 网球拍
  items_path: data.resultList
  fields:
    id: data.item.main.exContent.itemId
    title: data.item.main.exContent.title
    url_template: https://www.goofish.com/item?id={id}
    image: data.item.main.exContent.picUrl
    author: data.item.main.exContent.userNickName
    published_at: data.item.main.clickParam.args.publishTime
  pagination:
    page_param: pageNumber
    per_param: rowsPerPage
    has_next: data.resultInfo.hasNextPage

content:
  type: mtop_json
  api: mtop.taobao.idle.pc.detail
  url: https://h5api.m.goofish.com/h5/mtop.taobao.idle.pc.detail/1.0/
  fields:
    title: data.itemDetailDO.itemDO.title
    html: data.itemDetailDO.itemDO.richTextDesc
    image: data.itemDetailDO.itemDO.imageInfos

quirks:
  - PC 搜索/详情均走 h5api.m.goofish.com mtop，appKey=34839810；签名 MD5(token&t&appKey&data)。
  - token 取自 Cookie _m_h5_tk 下划线前半段；必须同时具备 unb、cookie2（登录态）。
  - 匿名或签名错误会触发 RGV587 / passport 滑块，勿伪造数据。
  - 列表 keyword 来自 entry_url 的 q（网球拍）；rowsPerPage 最大约 30。
  - 搜索原始卡片在 data.item.main.exContent（itemId/title/picUrl/userNickName），发布时间在 clickParam.args.publishTime。
  - 详情 idle.pc.detail 易触发 baxia；失败时用列表 hints（标题/图/摘要）组装 content_html。

validation:
  last_verified_at: "2026-07-31"
  expected_min_items: 1
  min_body_chars: 40
