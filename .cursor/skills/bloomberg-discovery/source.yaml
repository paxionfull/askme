id: bloomberg
name: Bloomberg
homepage: https://www.bloomberg.com/
entry_url: https://www.bloomberg.com/

discovery:
  type: sitemap_xml
  method: GET
  url: https://www.bloomberg.com/sitemaps/news/latest.xml
  fields:
    url: loc
    published_at: news.publication_date|lastmod
    title: news.title
    author: news.publication.name
    keywords: news.keywords
  pagination:
    mode: local_slice
    page_start: 1

content:
  type: html
  url_template: https://www.bloomberg.com/{id}

quirks:
  - Bloomberg 主站和文章页在当前环境常触发 PerimeterX 反爬挑战并返回 403。
  - 列表使用可访问的 news/latest.xml（非 RSS）作为稳定来源。
  - 详情抓取失败时返回包含标题、URL、发布时间、关键词的降级 content_html，保证 pipeline 可运行。
  - 发布时间优先使用 news:publication_date，其次 lastmod，统一转为 Asia/Shanghai ISO8601。

validation:
  last_verified_at: "2026-07-08"
  min_body_chars: 80
