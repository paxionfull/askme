id: reuters
name: Reuters
homepage: https://www.reuters.com/
entry_url: https://www.reuters.com/

discovery:
  type: sitemap_xml
  method: GET
  url: https://www.reuters.com/arc/outboundfeeds/news-sitemap/?outputType=xml
  fields:
    url: loc
    published_at: news.publication_date|lastmod
    title: news.title
    author: news.publication.name
    image: image.loc
    keywords: news.keywords
  pagination:
    mode: local_slice
    page_start: 1

content:
  type: html
  url_template: https://www.reuters.com/{id}/

quirks:
  - 主站与文章页受 DataDome 保护，匿名请求常返回 401 挑战页。
  - 列表使用可访问的 Arc news-sitemap（非 RSS）：/arc/outboundfeeds/news-sitemap/?outputType=xml。
  - 过滤 /es/ /fr/ /de/ /pt/ 等本地化路径，保留英文主站文章。
  - 详情抓取失败时返回含标题、URL、发布时间等元数据的降级 content_html。
  - 发布时间优先 news:publication_date，其次 lastmod，统一转为 Asia/Shanghai ISO8601。

validation:
  last_verified_at: "2026-07-10"
  min_body_chars: 80
