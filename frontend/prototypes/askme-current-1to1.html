function getFocusables(container){
  return $all(FOCUSABLE, container).filter(el => el.tabIndex !== -1 && !el.hasAttribute('disabled'));
}

function closeOverlayHost(){
  const host=$('#overlay-host');
  if(!host) return;
  host.innerHTML=''; host.hidden=true;
  document.removeEventListener('keydown', onOverlayKey, true);
  try { ui.previousFocus?.focus?.({preventScroll:true}); } catch {}
  ui.previousFocus=null;
}

function onOverlayKey(e){
  if(e.key==='Escape'){
    e.preventDefault(); e.stopPropagation();
    if(ui.menuRoot){ closeAllMenus(); return; }
    closeOverlayHost(); return;
  }
  const host=$('#overlay-host');
  const dialog = host && !host.hidden && host.querySelector('[role=dialog]');
  if(!dialog || e.key!=='Tab') return;
  const focusables=getFocusables(dialog);
  if(!focusables.length){ e.preventDefault(); return; }
  const first=focusables[0], last=focusables[focusables.length-1], active=document.activeElement;
  if(e.shiftKey){ if(!active||active===first||!dialog.contains(active)){ e.preventDefault(); last.focus(); } }
  else if(active===last){ e.preventDefault(); first.focus(); }
}

function openOverlayHtml(html){
  if(!html) return;
  closeAllMenus();
  const host=$('#overlay-host');
  ui.previousFocus=document.activeElement;
  host.hidden=false; host.innerHTML=html;
  const backdrop=host.querySelector('.ui-modal-backdrop');
  if(backdrop){
    backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeOverlayHost(); });
  }
  function appendScheduleRow(){
    const body=host.querySelector('.ui-modal-body');
    if(!body) return;
    let ul=body.querySelector('ul');
    if(!ul){
      body.innerHTML='<ul class="space-y-2"></ul>';
      ul=body.querySelector('ul');
    }
    const li=document.createElement('li');
    li.className='flex flex-nowrap items-center gap-2 rounded-[var(--radius-control)] border border-[color-mix(in_srgb,var(--accent)_35%,var(--rule))] bg-[color-mix(in_srgb,var(--accent-soft)_45%,var(--paper-raised))] px-2.5 py-2 text-sm';
    const daily=ui.locale==='zh'?'每天':'Daily';
    const every=ui.locale==='zh'?'每隔':'Every';
    const del=ui.locale==='zh'?'删除':'Delete';
    li.innerHTML=`<select aria-label="Schedule type" class="ui-input max-w-[4.6rem] shrink-0 px-2 py-1 text-xs"><option value="daily">${daily}</option><option value="interval">${every}</option></select><div class="flex min-w-0 shrink items-center gap-1"><input aria-label="Daily time" class="ui-input px-2 py-1 text-xs" type="time" value="10:00"></div><button type="button" class="ui-btn ui-btn-ghost ml-auto shrink-0 px-2 text-xs">${del}</button>`;
    ul.appendChild(li);
    li.querySelector('button')?.addEventListener('click', ()=> li.remove());
  }
  $all('button', host).forEach(btn => {
    const label=(btn.textContent||'').trim();
    if(/^(Close|Cancel|关闭|取消|Done|完成)$/i.test(label) || btn.getAttribute('data-act')==='cancel'){
      btn.addEventListener('click', (e)=>{ e.preventDefault(); closeOverlayHost(); });
    }
    if(btn.getAttribute('data-act')==='confirm' || /^(Save|保存)$/.test(label)){
      btn.addEventListener('click', (e)=>{ e.preventDefault(); closeOverlayHost(); });
    }
    if(/^(Add schedule|添加定时)$/.test(label)){
      btn.addEventListener('click', (e)=>{ e.preventDefault(); appendScheduleRow(); });
    }
  });
  document.addEventListener('keydown', onOverlayKey, true);
  requestAnimationFrame(() => {
    const dialog=host.querySelector('[role=dialog]')||host;
    (getFocusables(dialog)[0]||dialog).focus?.({preventScroll:true});
  });
}

function openConfirm(kind){
  const pack = CONFIRMS[ui.locale][kind] || CONFIRMS.en[kind];
  if(!pack) return;
  const [title, message, confirm, danger] = pack;
  const cancel = ui.locale==='zh' ? '取消' : 'Cancel';
  const btn = danger ? 'ui-btn-danger-solid' : 'ui-btn-primary';
  openOverlayHtml(`<div class="ui-modal-backdrop ui-modal-backdrop-nested" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title"><div class="ui-modal ui-modal-sm"><div class="ui-modal-header"><h2 id="confirm-modal-title" class="ui-modal-title">${title}</h2><p class="ui-modal-desc whitespace-pre-line">${message}</p></div><div class="ui-modal-footer"><button type="button" class="ui-btn" data-act="cancel">${cancel}</button><button type="button" class="ui-btn ${btn}" data-act="confirm">${confirm}</button></div></div></div>`);
}

function menuItemClass(item){
  const danger = item.danger ? 'text-[var(--danger-text)] hover:bg-[var(--error-soft)]' : 'text-[var(--ink)] hover:bg-[var(--paper)]';
  return `flex min-h-9 w-full items-center justify-between gap-3 px-3 py-1.5 text-left text-xs disabled:cursor-not-allowed disabled:opacity-40 ${danger}`;
}
function clearSubmenuTimer(){ if(ui.submenuTimer){ clearTimeout(ui.submenuTimer); ui.submenuTimer=null; } }
function closeAllMenus(){
  clearSubmenuTimer();
  ui.menuRoot?.remove(); ui.menuRoot=null;
  document.removeEventListener('mousedown', onMenuOutside, true);
}
function onMenuOutside(e){
  if(ui.menuRoot && !ui.menuRoot.contains(e.target)){
    if(e.target?.closest?.('[aria-haspopup=menu]')) return;
    closeAllMenus();
  }
}
function positionNear(trigger, el){
  const rect=trigger.getBoundingClientRect();
  const mw=Math.max(el.offsetWidth||152,144);
  const mh=el.offsetHeight||120;
  let top=Math.min(window.innerHeight-mh-8, rect.bottom+4);
  if(rect.bottom+mh+8>window.innerHeight && rect.top>mh+8) top=Math.max(8, rect.top-mh-4);
  let left=Math.min(window.innerWidth-mw-8, Math.max(8, rect.right-mw));
  el.style.top=`${top}px`; el.style.left=`${left}px`;
}

function openFlyoutMenu(trigger, items, ariaLabel='Menu'){
  closeAllMenus();
  ui.previousFocus=document.activeElement;
  const root=document.createElement('div');
  root.className='proto-menu-layer';
  root.innerHTML=`<div role="menu" aria-label="${ariaLabel}" class="proto-menu fixed z-[80] min-w-[9.5rem] rounded-md border border-[var(--rule)] bg-[var(--paper-raised)] py-1 shadow-lg"></div>`;
  const menu=root.querySelector('[role=menu]');
  items.forEach(item => {
    const btn=document.createElement('button');
    btn.type='button'; btn.role='menuitem'; btn.className=menuItemClass(item);
    if(item.disabled) btn.disabled=true;
    if(item.submenu?.length){
      btn.setAttribute('aria-haspopup','menu'); btn.setAttribute('aria-expanded','false');
      btn.innerHTML=`<span>${item.label}</span><span class="text-[var(--ink-muted)]">›</span>`;
      const openSub=()=>{
        clearSubmenuTimer();
        $all('.proto-submenu', root).forEach(n=>n.remove());
        btn.setAttribute('aria-expanded','true');
        const sub=document.createElement('div');
        sub.role='menu';
        sub.className='proto-submenu fixed z-[90] max-h-56 min-w-[9rem] overflow-y-auto rounded-md border border-[var(--rule)] bg-[var(--paper-raised)] py-1 shadow-lg';
        item.submenu.forEach(subItem=>{
          const sbtn=document.createElement('button');
          sbtn.type='button'; sbtn.role='menuitem'; sbtn.className=menuItemClass(subItem);
          sbtn.innerHTML=`<span class="truncate">${subItem.label}</span>`;
          sbtn.addEventListener('click', e=>{ e.stopPropagation(); closeAllMenus(); subItem.onSelect?.(); });
          sub.appendChild(sbtn);
        });
        root.appendChild(sub);
        const br=btn.getBoundingClientRect();
        const mw=Math.max(sub.offsetWidth||144,144);
        let left=br.right+4; if(left+mw>window.innerWidth-8) left=Math.max(8, br.left-mw-4);
        let top=br.top; const mh=sub.offsetHeight||120; if(top+mh>window.innerHeight-8) top=Math.max(8, window.innerHeight-mh-8);
        sub.style.top=`${top}px`; sub.style.left=`${left}px`;
        sub.addEventListener('mouseenter', clearSubmenuTimer);
        sub.addEventListener('mouseleave', ()=>{ ui.submenuTimer=setTimeout(()=>{ sub.remove(); btn.setAttribute('aria-expanded','false'); }, 160); });
      };
      btn.addEventListener('mouseenter', openSub);
      btn.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); openSub(); });
      btn.addEventListener('mouseleave', ()=>{ ui.submenuTimer=setTimeout(()=>{ const sub=$('.proto-submenu', root); if(sub && !sub.matches(':hover')){ sub.remove(); btn.setAttribute('aria-expanded','false'); } }, 180); });
    } else {
      btn.textContent=item.label;
      btn.addEventListener('click', e=>{ e.preventDefault(); e.stopPropagation(); closeAllMenus(); item.onSelect?.(); });
    }
    menu.appendChild(btn);
  });
  document.body.appendChild(root);
  ui.menuRoot=root;
  positionNear(trigger, menu);
  document.addEventListener('mousedown', onMenuOutside, true);
  document.addEventListener('keydown', onOverlayKey, true);
  requestAnimationFrame(()=> getFocusables(menu)[0]?.focus?.({preventScroll:true}));
}

function wireStaticInteractions(root){

  $all('a.app-nav-link', root).forEach(a=>{

      e.preventDefault();
      const href=a.getAttribute('href')||'';

      else if(href.includes('sources')) renderPage('sources');
      else if(href.includes('settings')) renderPage('settings');
    });
  });

  // Language toggle — full page swap
  $all('.app-lang-toggle', root).forEach(group=>{
    group.addEventListener('click', e=>{
      const btn=e.target.closest('button');
      if(!btn) return;
      const next = /中文/.test(btn.textContent||'') ? 'zh' : 'en';
      setLocale(next);
    });

  // Banner close
  $all('button', root).forEach(btn=>{

  });
  $all('button', root).forEach(btn=>{
    if(/^(Manage groups|管理分组)$/.test((btn.textContent||'').trim())){

    }

        // If already inside a schedule modal, append a demo row instead of nesting

            ul.appendChild(li);
            const empty=host.querySelector('.ui-modal-body > p');
            if(empty) empty.remove();
            if(!ul.parentElement){ /* noop */ }
          } else {
            // empty state: create list
            const body=host.querySelector('.ui-modal-body');
            if(body){
              body.innerHTML='<ul class="space-y-2"></ul>';
              btn.click();
            }
          }
          return;
        }
        openOverlayHtml(OVERLAYS.groupSchedule);
      });
    }
  });

  // Group Actions ⋯ + Feed More
  $all('button[aria-haspopup="menu"]', root).forEach(btn=>{
    const aria=btn.getAttribute('aria-label')||'';
    btn.addEventListener('click', e=>{
      e.preventDefault(); e.stopPropagation();
      if(ui.menuRoot) closeAllMenus();
      if(aria.startsWith('Actions for ') || aria.endsWith(' 的操作')){
        const name = aria.startsWith('Actions for ') ? aria.slice('Actions for '.length) : aria.replace(/ 的操作$/, '');
        openGroupMenuAt(btn, name);
        return;
      }
      if(aria==='More' || aria==='更多'){
        openFlyoutMenu(btn, feedMenuItems(), aria);
        return;
      }
      if(aria==='Chat options' || aria.includes('对话选项')){
        openFlyoutMenu(btn, chatMenuItems(), aria);
      }
    });
  });

  // Group ROW right-click (context menu) — key missing feature
  $all('.group\\/section, [class*=\"group/section\"]', root).forEach(section=>{
    section.addEventListener('contextmenu', e=>{
      e.preventDefault();
      // find group name from expand button text
      const nameBtn = section.querySelector('button.flex.min-w-0, button[class*=\"flex min-w-0\"]');
      const labelSpan = section.querySelector('.truncate');
      const name = (labelSpan?.textContent||'').trim() || 'ai';
      openGroupMenuAt(null, name, e.clientX, e.clientY);
      // reposition menu to cursor
      const menu = ui.menuRoot?.querySelector('[role=menu]');
      if(menu){
        menu.style.top=`${Math.min(window.innerHeight-8, e.clientY)}px`;
        menu.style.left=`${Math.min(window.innerWidth-160, e.clientX)}px`;
      }
    });
  });
  // Also bind contextmenu on group header buttons that show the name
  $all('button', root).forEach(btn=>{
    // group title buttons often contain ▾/▸
    const txt=(btn.textContent||'');
    if(/[▾▸]/.test(txt) && btn.closest('.group\\/section, [class*=\"group/section\"]')){
      btn.addEventListener('contextmenu', e=>{
        e.preventDefault(); e.stopPropagation();
        const name=(btn.querySelector('.truncate')?.textContent||btn.textContent||'').replace(/[▾▸]/g,'').trim();
        openGroupMenuAt(btn, name, e.clientX, e.clientY);
        const menu=ui.menuRoot?.querySelector('[role=menu]');
        if(menu){ menu.style.top=`${e.clientY}px`; menu.style.left=`${e.clientX}px`; }
      });
    }
  });

  // Settings tabs
  const tabMap = [
    [/^(Skills|技能)$/, 'Skills'],
    [/^(Schedule|定时)$/, 'Schedule'],
    [/^API Key$/, 'API Key'],
    [/^(Login cookies|登录 Cookie|登录)$/, 'Login cookies'],
  ];
  $all('button, a', root).forEach(el=>{
    const t=(el.textContent||'').trim();
    for(const [re,key] of tabMap){
      if(re.test(t)){
        el.addEventListener('click', e=>{ e.preventDefault(); switchSettingsTab(key); });
      }
    }
  });

  // Settings Skills / Schedule / API Key / Login actions
  $all('button', root).forEach(btn=>{
    const t=(btn.textContent||'').trim();
    const title=(btn.getAttribute('title')||btn.getAttribute('aria-label')||'').trim();
    const label = title || t;
    if(/^(New|新建|New digest rule|新建整理规则|新建规则)$/.test(t)){
      btn.addEventListener('click', e=>{ e.preventDefault(); openOverlayHtml(OVERLAYS.digestProfileNew || OVERLAYS.skillOrDigestView); });
    }
    if(/^View |^查看 /.test(label)){
      btn.addEventListener('click', e=>{ e.preventDefault(); openOverlayHtml(OVERLAYS.skillOrDigestView); });
    }
    if(/^Delete |^删除 /.test(label) && !btn.closest('[role=menu]')){
      btn.addEventListener('click', e=>{
        e.preventDefault();
        if(OVERLAYS.deleteSkillConfirm) openOverlayHtml(OVERLAYS.deleteSkillConfirm);
        else openConfirm('deleteSkill');
      });
    }
    if(/^(Restore|恢复) /.test(label) || t==='↺'){
      btn.addEventListener('click', e=>{ e.preventDefault(); openOverlayHtml(OVERLAYS.skillOrDigestView); });
    }
    if(/^(Reset|重置)$/.test(t)){
      btn.addEventListener('click', e=>{
        e.preventDefault();
        const block = btn.closest('section, .ui-panel, div')?.textContent||'';
        if(/Embedding|嵌入/.test(block)) openOverlayHtml(OVERLAYS.resetEmbedConfirm);
        else openOverlayHtml(OVERLAYS.resetLlmConfirm);
      });
    }
    if(/Select groups|选择分组|groups selected|个分组/.test(t)){
      btn.addEventListener('click', e=>{
        e.preventDefault();
        const zhPop = OVERLAYS.scheduleGroupsPopZh;
        openOverlayHtml((ui.locale==='zh' && zhPop) ? zhPop : OVERLAYS.scheduleGroupsPop);
      });
    }
    if(/^(Re-login|重新登录)$/.test(t)){
      btn.addEventListener('click', e=>{
        e.preventDefault();
        const html = SETTINGS_TABS[ui.locale]?.['Login cookies auth'] || SETTINGS_TABS.en['Login cookies auth'];
        if(html){ root.innerHTML=html; wireStaticInteractions(root); }
      });
    }
    if(/Feedback & repair|反馈/.test(t)){
      btn.addEventListener('click', e=>{ e.preventDefault(); openOverlayHtml(OVERLAYS.skillRepair || OVERLAYS.skillOrDigestView); });
    }
  });

  // Mobile brief tabs
  $all('.app-brief-mobile-tabs button', root).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const ask=/Ask|提问/.test(btn.textContent||'');
      $all('.app-brief-mobile-tabs button', root).forEach(b=> b.classList.toggle('is-active', b===btn));
      $('.app-brief-overview-pane', root)?.classList.toggle('is-mobile-hidden', ask);
      $('.app-brief-ask-pane', root)?.classList.toggle('is-mobile-hidden', !ask);
    });
  });

  $all('a[href]', root).forEach(a=>{
    const href=a.getAttribute('href')||'';
    if(href.startsWith('http')||href.startsWith('mailto:')||href.startsWith('#')) return;
    if(a.classList.contains('app-nav-link')) return;
    a.addEventListener('click', e=>{
      if(href.includes('settings')){ e.preventDefault(); renderPage('settings'); }
      else if(href.includes('sources')){ e.preventDefault(); renderPage('sources'); }
      else if(href==='/'){ e.preventDefault(); renderPage('brief'); }
    });
  });
  $all('form', root).forEach(f=> f.addEventListener('submit', e=> e.preventDefault()));
}

function renderPage(page){
  ui.page=page;
  const root=$('#proto-root');
  const html = PAGES[ui.locale]?.[page] || PAGES.en[page] || '';
  root.innerHTML=html;
  closeOverlayHost(); closeAllMenus();
  wireStaticInteractions(root);
  // sync lang toggle pressed state
  $all('.app-lang-toggle', root).forEach(group=>{
    $all('button', group).forEach(b=>{
      const isZh=/中文/.test(b.textContent||'');
      const on = (ui.locale==='zh') === isZh;
      b.classList.toggle('is-active', on);
      b.setAttribute('aria-pressed', on?'true':'false');
    });
  });
}

async function boot(){
  $('#btn-live').addEventListener('click', showLive);
  $('#btn-static').addEventListener('click', showStatic);
  $('#btn-ui').addEventListener('click', showUiCatalog);
  const live=await probeLive();
  if(live===false){ setStatus('Live offline · static snapshot'); showStatic(); }
  else showLive();
}
boot();





</script>
</body>
</html>
